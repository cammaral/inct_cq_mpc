# ============================================================
# INCT — MULTIPLICATIVE POLYNOMIAL COUPLING (MPC)
# Burgers 1D e Black-Scholes
# MLP | MPC Classica | MPC Hibrida | QNN
# ============================================================

# ------------------------------------------------------------
# 1. PROBLEMAS
# ------------------------------------------------------------

problems:
  burgers:
    bounds: [[0.0, 1.0], [0.0, 1.0]]
    nu: 0.05
    a: 0.9
    b: 1.0

  black_scholes:
    bounds: [[0.0, 160.0], [0.0, 1.0]]
    strike: 40.0
    rate: 0.05
    sigma: 0.2


# ------------------------------------------------------------
# 2. DADOS
# ------------------------------------------------------------

data:
  train: 300
  val: 300
  test_grid: 250


# ------------------------------------------------------------
# 3. TREINAMENTO
# ------------------------------------------------------------

training:
  device: cpu
  epochs: 1000
  batch_size: 300
  lr: 0.003
  scheduler: none
  min_lr: 0.00001
  clip: null


# ------------------------------------------------------------
# 4. REPRODUTIBILIDADE
# ------------------------------------------------------------

seeds: [1924, 1925, 1926, 1973, 2025, 2024, 2012, 1958, 1962, 1997]

output: results


# ------------------------------------------------------------
# 5. MODELOS
# ------------------------------------------------------------

models:

  # MLP convencional
  - name: mlp
    kind: mlp
    width: 32
    depth: 3
    activation: tanh

  # MPC classica
  - name: mpc_classical
    kind: mpc_classical
    width: 32
    depth: 3
    activation: tanh
    terms: 5
    powers: true
    aggregation: mean

  # MPC hibrida
  # Um circuito compartilhado de 5 qubits, sem entrada x/t.
  # Cinco valores esperados do mesmo estado quantico.
  - name: mpc_hybrid
    kind: mpc_hybrid
    width: 32
    depth: 3
    activation: tanh
    terms: 5
    qubits: 5
    layers: 5
    observables: [ZIIII, ZZIII, ZZZII, ZZZZI, ZZZZZ]
    powers: true
    aggregation: mean
    quantum_trainable: true

  # QNN convencional com encoding de x/t
  - name: qnn
    kind: qnn
    qubits: 5
    layers: 5
    observables: [ZIIII, IZIII, IIZII, IIIZI, IIIIZ]


# ============================================================
# 6. ABLACOES
# Executar com: python run.py --ablations
# ============================================================

ablations:

  # ----------------------------------------------------------
  # A. ACOPLAMENTO MPC
  # ----------------------------------------------------------

  - {name: hybrid_sum, model: mpc_hybrid,
     changes: {model.aggregation: sum}}

  - {name: classical_sum, model: mpc_classical,
     changes: {model.aggregation: sum}}

  - {name: hybrid_no_powers, model: mpc_hybrid,
     changes: {model.powers: false}}

  - {name: classical_no_powers, model: mpc_classical,
     changes: {model.powers: false}}


  # ----------------------------------------------------------
  # B. NUMERO DE TERMOS MPC
  # MPC hibrida: circuito permanece com 5 qubits.
  # Somente o numero de valores esperados e alterado.
  # ----------------------------------------------------------

  - {name: hybrid_1term, model: mpc_hybrid,
     changes: {model.terms: 1,
               model.observables: [ZIIII]}}

  - {name: hybrid_2terms, model: mpc_hybrid,
     changes: {model.terms: 2,
               model.observables: [ZIIII, ZZIII]}}

  - {name: hybrid_3terms, model: mpc_hybrid,
     changes: {model.terms: 3,
               model.observables: [ZIIII, ZZIII, ZZZII]}}

  - {name: hybrid_4terms, model: mpc_hybrid,
     changes: {model.terms: 4,
               model.observables: [ZIIII, ZZIII, ZZZII, ZZZZI]}}

  - {name: classical_1term, model: mpc_classical,
     changes: {model.terms: 1}}

  - {name: classical_2terms, model: mpc_classical,
     changes: {model.terms: 2}}

  - {name: classical_3terms, model: mpc_classical,
     changes: {model.terms: 3}}

  - {name: classical_4terms, model: mpc_classical,
     changes: {model.terms: 4}}


  # ----------------------------------------------------------
  # C. CORRELATORES DE PAULI
  # Todos medidos no mesmo circuito de 5 qubits.
  # ----------------------------------------------------------

  # Correlatores X
  - {name: hybrid_pauli_x, model: mpc_hybrid,
     changes: {model.observables:
       [XIIII, XXIII, XXXII, XXXXI, XXXXX]}}

  # Correlatores Y
  - {name: hybrid_pauli_y, model: mpc_hybrid,
     changes: {model.observables:
       [YIIII, YYIII, YYYII, YYYYI, YYYYY]}}

  # Correlatores mistos
  - {name: hybrid_mixed_pauli, model: mpc_hybrid,
     changes: {model.observables:
       [ZIIII, XZIII, YXZII, ZXYZI, XYZXY]}}

  # Observaveis locais Z
  - {name: hybrid_local_z, model: mpc_hybrid,
     changes: {model.observables:
       [ZIIII, IZIII, IIZII, IIIZI, IIIIZ]}}

  # Correlatores de pares Z
  - {name: hybrid_pair_z, model: mpc_hybrid,
     changes: {model.observables:
       [ZIIII, ZZIII, IZZII, IIZZI, IIIZZ]}}

  # Correlatores esparsos Z
  - {name: hybrid_sparse_z, model: mpc_hybrid,
     changes: {model.observables:
       [ZIIII, ZIZII, ZIIZI, ZIIIZ, ZIZIZ]}}


  # ----------------------------------------------------------
  # D. PROFUNDIDADE DOS CIRCUITOS QUANTICOS
  # Baseline: 5 camadas
  # ----------------------------------------------------------

  - {name: hybrid_1q_layer, model: mpc_hybrid,
     changes: {model.layers: 1}}

  - {name: hybrid_2q_layers, model: mpc_hybrid,
     changes: {model.layers: 2}}

  - {name: hybrid_4q_layers, model: mpc_hybrid,
     changes: {model.layers: 4}}

  - {name: hybrid_8q_layers, model: mpc_hybrid,
     changes: {model.layers: 8}}

  - {name: hybrid_frozen, model: mpc_hybrid,
     changes: {model.quantum_trainable: false}}

  - {name: qnn_1layer, model: qnn,
     changes: {model.layers: 1}}

  - {name: qnn_2layers, model: qnn,
     changes: {model.layers: 2}}

  - {name: qnn_8layers, model: qnn,
     changes: {model.layers: 8}}


  # ----------------------------------------------------------
  # E. ARQUITETURA CLASSICA
  # Baseline: 3 camadas ocultas, 32 neuronios
  # ----------------------------------------------------------

  # MPC hibrida — profundidade
  - {name: hybrid_1layer, model: mpc_hybrid,
     changes: {model.depth: 1}}

  - {name: hybrid_2layers, model: mpc_hybrid,
     changes: {model.depth: 2}}

  - {name: hybrid_4layers, model: mpc_hybrid,
     changes: {model.depth: 4}}

  # MPC hibrida — largura
  - {name: hybrid_16neurons, model: mpc_hybrid,
     changes: {model.width: 16}}

  - {name: hybrid_64neurons, model: mpc_hybrid,
     changes: {model.width: 64}}

  # MLP convencional — profundidade
  - {name: mlp_1layer, model: mlp,
     changes: {model.depth: 1}}

  - {name: mlp_2layers, model: mlp,
     changes: {model.depth: 2}}

  - {name: mlp_4layers, model: mlp,
     changes: {model.depth: 4}}

  # MLP convencional — largura
  - {name: mlp_16neurons, model: mlp,
     changes: {model.width: 16}}

  - {name: mlp_64neurons, model: mlp,
     changes: {model.width: 64}}


  # ----------------------------------------------------------
  # F. LEARNING RATE
  # Baseline: 0.003
  # ----------------------------------------------------------

  - {name: hybrid_lr_001, model: mpc_hybrid,
     changes: {training.lr: 0.001}}

  - {name: hybrid_lr_0001, model: mpc_hybrid,
     changes: {training.lr: 0.0001}}


  # ----------------------------------------------------------
  # G. SCHEDULER
  # ----------------------------------------------------------

  - {name: hybrid_no_scheduler, model: mpc_hybrid,
     changes: {training.scheduler: none}}

  - {name: hybrid_min_lr_0001, model: mpc_hybrid,
     changes: {training.min_lr: 0.0001}}


  # ----------------------------------------------------------
  # H. NUMERO DE EPOCAS
  # Baseline: 1000
  # ----------------------------------------------------------

  - {name: hybrid_2000epochs, model: mpc_hybrid,
     changes: {training.epochs: 2000}}

  - {name: hybrid_5000epochs, model: mpc_hybrid,
     changes: {training.epochs: 5000}}


  # ----------------------------------------------------------
  # I. QUANTIDADE DE DADOS
  # Baseline: 300 pontos
  # ----------------------------------------------------------

  - {name: hybrid_128points, model: mpc_hybrid,
     changes: {data.train: 128}}

  - {name: hybrid_512points, model: mpc_hybrid,
     changes: {data.train: 512}}

  - {name: hybrid_1000points, model: mpc_hybrid,
     changes: {data.train: 1000}}


  # ----------------------------------------------------------
  # J. TAMANHO DO BATCH
  # Baseline: 300
  # ----------------------------------------------------------

  - {name: hybrid_batch_32, model: mpc_hybrid,
     changes: {training.batch_size: 32}}

  - {name: hybrid_batch_64, model: mpc_hybrid,
     changes: {training.batch_size: 64}}


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-mpc"
version = "0.1.0"
description = "Rede hibrida MLP + QNN com acoplamento MPC sequencial"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "matplotlib>=3.7", "PyYAML>=6.0"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.0"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
